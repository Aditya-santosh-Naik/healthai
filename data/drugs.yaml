# Common Indian medicines: brand -> generic, drug class, and known side effects.
#
# Brand names are what people actually type. "I take Dolo" must resolve to
# paracetamol before any safety check can run.
#
# side_effects drive the adverse-drug-reaction check: if a reported symptom is
# a known side effect of something the patient already takes, say so.

source_note: >-
  Class and side-effect data compiled from MedlinePlus drug pages and NIH
  DailyMed labels. Every row carries its own source_url.

drugs:

  # --- analgesics / antipyretics -------------------------------------------
  - generic: paracetamol
    display: Paracetamol (Acetaminophen)
    brands: [Crocin, Dolo, Dolo 650, Calpol, Metacin, Pacimol, Paracip, Sumo]
    drug_class: analgesic_antipyretic
    otc: true
    side_effects: [nausea, rash, loss_of_appetite]
    source_url: https://medlineplus.gov/druginfo/meds/a681004.html

  - generic: ibuprofen
    display: Ibuprofen
    brands: [Brufen, Ibugesic, Advil, Combiflam]
    drug_class: nsaid
    otc: true
    side_effects: [upper_abdominal_pain, nausea, heartburn, indigestion, bloating, black_stools, dizziness]
    source_url: https://medlineplus.gov/druginfo/meds/a682159.html

  - generic: ibuprofen+paracetamol
    display: Ibuprofen + Paracetamol
    brands: [Combiflam, Flexon, Ibugesic Plus]
    drug_class: nsaid
    otc: true
    side_effects: [upper_abdominal_pain, nausea, heartburn, indigestion, black_stools]
    source_url: https://medlineplus.gov/druginfo/meds/a682159.html

