    otc: false
    side_effects: [upper_abdominal_pain, heartburn, nausea, bloating]
    source_url: https://medlineplus.gov/druginfo/meds/a681029.html

  - generic: aspirin
    display: Aspirin
    brands: [Disprin, Ecosprin, Aspicot]
