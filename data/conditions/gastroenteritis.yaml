code: gastroenteritis
display_name: Gastroenteritis (Stomach Flu)
sources:
  - name: MedlinePlus - Gastroenteritis
    url: https://medlineplus.gov/gastroenteritis.html
  - name: NIH NIDDK - Viral Gastroenteritis
    url: https://www.niddk.nih.gov/health-information/digestive-diseases/viral-gastroenteritis
hallmark_symptoms: [diarrhoea, vomiting, abdominal_cramps]
supporting_symptoms: [nausea, low_grade_fever, watery_diarrhoea, weakness, abdominal_pain, loss_of_appetite, body_ache, fatigue]
expected_symptoms: [diarrhoea]
