# Symptom implications.
#
# A specific symptom entails its broader parent: someone reporting "high fever"
# has reported a fever, and a condition expecting `fever` must be satisfied by
# it. Also lets combination red flags fire -- "chest pain radiating to the arm"
# must satisfy a rule that needs both chest_pain and chest_pain_radiating.
#
# Implications are applied only to POSITIVE findings. Denying "high fever" does
# not deny fever.
implications:
  high_fever: [fever]
  low_grade_fever: [fever]
  severe_headache: [headache]
  retro_orbital_pain: [headache]
  dry_cough: [cough]
  productive_cough: [cough]
  cough_worse_at_night: [cough]
  sputum_discoloured: [productive_cough, cough]
  blood_in_sputum: [cough]
  severe_body_ache: [body_ache]
  muscle_pain: [body_ache]
  severe_sore_throat: [sore_throat]
  tonsil_exudate: [sore_throat]
  swollen_tonsils: [sore_throat]
  painful_swallowing: [sore_throat]
  persistent_vomiting: [vomiting]
  blood_in_vomit: [vomiting]
